$kind: http-request
url: "{{baseUrl}}/products/{{productId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Тест 2",
      "price": 150
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 5000
