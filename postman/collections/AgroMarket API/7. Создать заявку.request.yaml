$kind: http-request
url: "{{baseUrl}}/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Тест",
      "email": "t@t.kz",
      "quantity": 20
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 201', () => {
        pm.response.to.have.status(201);
      });

      // Запоминаем id заявки для запроса 9
      pm.collectionVariables.set('orderId', pm.response.json().id);
    language: text/javascript
order: 7000
