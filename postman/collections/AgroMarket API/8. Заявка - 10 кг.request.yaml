$kind: http-request
name: 8. Заявка < 10 кг
url: "{{baseUrl}}/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Тест",
      "email": "t@t.kz",
      "quantity": 5
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 400', () => {
        pm.response.to.have.status(400);
      });

      pm.test('Текст ошибки содержит «10 кг»', () => {
        pm.expect(pm.response.json().error).to.include('10 кг');
      });
    language: text/javascript
order: 8000
