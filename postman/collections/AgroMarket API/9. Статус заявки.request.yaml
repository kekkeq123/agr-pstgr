$kind: http-request
url: "{{baseUrl}}/orders/{{orderId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "processing"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 9000
