$kind: http-request
url: "{{baseUrl}}/products"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Яблоки",
      "category": "Фрукты",
      "price": 350,
      "unit": "кг",
      "image": "https://..."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 201', () => {
        pm.response.to.have.status(201);
      });

      pm.test('В ответе есть id и переданное имя', () => {
        const body = pm.response.json();
        pm.expect(body.id).to.be.a('number');
        pm.expect(body.name).to.eql('Тест');
      });

      // Запоминаем id — его используют запросы 4, 5, 10, 11
      pm.collectionVariables.set('productId', pm.response.json().id);
    language: text/javascript
order: 3000
